name: Preview cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Remove PR preview from gh-pages
        run: |
          set -euo pipefail

          DEST="pr-${{ github.event.number }}"

          # Nothing to do if gh-pages doesn't exist yet
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1 || exit 0

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages:gh-pages

          TMP=$(mktemp -d)
          cleanup() { git worktree remove --force "$TMP" 2>/dev/null || true; rm -rf "$TMP"; }
          trap cleanup EXIT

          git worktree add "$TMP" gh-pages

          # Nothing to do if the preview directory doesn't exist
          [ -d "$TMP/$DEST" ] || exit 0

          cd "$TMP"
          rm -rf "$DEST"
          git add -A
          git commit -m "Remove preview for PR #${{ github.event.number }}"
          git push origin gh-pages

      - name: Update PR comment to mark preview removed
        uses: actions/github-script@v7
        with:
          script: |
            const marker  = '<!-- build-artifacts-bot -->';
            const prNum   = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (!existing) return;

            // Replace the Preview line with a "removed" note
            const updated = existing.body.replace(
              /\*\*Preview:\*\* .+/,
              '**Preview:** ~~removed on PR close~~'
            );

            if (updated !== existing.body) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: updated,
              });
            }
